[project]
name = "fed_news"
version = "0.2.0"
description = "Final study: does Fed tone help forecast FOMC decisions? Ordered logit and tuned LSTM / GRU / TFT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
# The exact versions that produced results/ (results/pip_freeze.txt has the full environment).
dependencies = [
    "anthropic==1.13.0",
    "beautifulsoup4==4.14.3",
    "lxml==6.1.1",
    "numpy==2.3.2",
    "openpyxl==3.1.5",
    "optuna==4.5.0",
    "pandas==3.0.0",
    "pyarrow==25.0.1",
    "pypdf==6.16.1",
    "pysentiment2==0.1.1",
    "requests==2.32.5",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "tabulate==0.10.0",
    "torch==2.11.0",
    "transformers==5.17.0",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "coral-pytorch==1.4.0"]  # coral-pytorch: test oracle for the CORAL study

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fed_news"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: downloads data from the internet",
    "gpu: needs CUDA and cached Hugging Face models",
]
addopts = "-m 'not network and not gpu'"
